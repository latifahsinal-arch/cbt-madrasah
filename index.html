    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      const icons = { success: '✅', error: '⚠️', warning: '🔔', info: 'ℹ️' };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs font-bold transition-all duration-300 ${styles[type] || styles.info}`;
      toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${esc(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    async function hashPasswordSHA256(plainText) {
      const enc = new TextEncoder().encode(String(plainText));
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function restoreSessionState() {

        const parsed = JSON.parse(raw);
        if (parsed.currentUser) state.currentUser = parsed.currentUser;

        if (parsed.beritaAcaraManual) state.beritaAcaraManual = { ...state.beritaAcaraManual, ...parsed.beritaAcaraManual };
      } catch (e) {}
    }

    async function dbSaveDoc(colName, docId, payload, stateKey = null) {
      if (stateKey && Array.isArray(state[stateKey])) {
        const idx = state[stateKey].findIndex(item => item.id === docId);
        const record = { id: docId, ...payload };
        if (idx >= 0) state[stateKey][idx] = record;
        else state[stateKey].push(record);
      }

      if (!IS_PREVIEW && fbDb && fbMod) {
        try {
          await fbMod.setDoc(fbMod.doc(fbDb, colName, docId), payload, { merge: true });
        } catch (err) {
          console.error(`Gagal menyimpan ke Firestore (${colName}/${docId}):`, err);
          showToast('Peringatan sinkronisasi cloud: ' + (err?.message || err?.code), 'warning');
        }
      }
      savePreviewSnapshot();
      saveSessionState();
    }

    async function dbDeleteDoc(colName, docId, stateKey = null) {
      if (stateKey && Array.isArray(state[stateKey])) {
        state[stateKey] = state[stateKey].filter(item => item.id !== docId);
      }

      if (!IS_PREVIEW && fbDb && fbMod) {
        try {
          await fbMod.deleteDoc(fbMod.doc(fbDb, colName, docId));
        } catch (err) {
          console.error(`Gagal menghapus dari Firestore (${colName}/${docId}):`, err);
          showToast('Peringatan hapus cloud: ' + (err?.message || err?.code), 'warning');
        }
      }
      savePreviewSnapshot();
      saveSessionState();
    }

    function downloadCSV(filename, headers, rows) {
      const lines = ['sep=;', headers.join(';')];
      rows.forEach(r => {
        lines.push(r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(';'));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Template CSV "${filename}" berhasil diunduh!`, 'success');
    }

    async function parseSpreadsheetFile(file) {
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.xlsx')) {
        if (!window.JSZip) throw new Error('Pustaka pembaca .xlsx belum siap. Muat ulang halaman.');
        const buf = await file.arrayBuffer();
        const zip = await window.JSZip.loadAsync(buf);
        const sharedStrings = [];
        const ssFile = zip.file('xl/sharedStrings.xml');
        if (ssFile) {
          const ssXml = await ssFile.async('text');
          const doc = new DOMParser().parseFromString(ssXml, 'application/xml');
          doc.querySelectorAll('si').forEach(si => {
            const parts = Array.from(si.querySelectorAll('t')).map(t => t.textContent || '');
            sharedStrings.push(parts.join(''));
          });
        }
        const sheetFile = zip.file('xl/worksheets/sheet1.xml');
        if (!sheetFile) throw new Error('Sheet1 tidak ditemukan di dalam file .xlsx.');
        const sheetXml = await sheetFile.async('text');
        const sheetDoc = new DOMParser().parseFromString(sheetXml, 'application/xml');
        const rows = [];
        sheetDoc.querySelectorAll('sheetData row').forEach(rowEl => {
          const rowArr = [];
          rowEl.querySelectorAll('c').forEach(cEl => {
            const ref = cEl.getAttribute('r') || '';
            const colLetters = ref.replace(/[0-9]/g, '');
            let colIdx = 0;
            for (let i = 0; i < colLetters.length; i++) {
              colIdx = colIdx * 26 + (colLetters.charCodeAt(i) - 64);
            }
            colIdx = Math.max(0, colIdx - 1);
            const t = cEl.getAttribute('t');
            let val = '';
            if (t === 's') {
              const idx = Number(cEl.querySelector('v')?.textContent || 0);
              val = sharedStrings[idx] ?? '';
            } else if (t === 'inlineStr') {
              val = Array.from(cEl.querySelectorAll('t')).map(x => x.textContent || '').join('');
            } else {
              val = cEl.querySelector('v')?.textContent ?? '';
            }
            rowArr[colIdx] = val;
          });
          if (rowArr.some(v => String(v || '').trim() !== '')) rows.push(rowArr);
        });
        return rows;
      }

      const rawText = await file.text();
      if (rawText.includes('<table') || rawText.includes('<tr')) {
        const doc = new DOMParser().parseFromString(rawText, 'text/html');
        const rows = [];
        doc.querySelectorAll('tr').forEach(tr => {
          const cells = Array.from(tr.querySelectorAll('th, td')).map(td => td.textContent.trim());
          if (cells.length > 1 && cells.some(c => c !== '')) rows.push(cells);
        });
        return rows;
      }

      const lines = rawText.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim() && !/^sep=/i.test(l.trim()));
      if (lines.length === 0) return [];
      const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
      return lines.map(line => line.split(delim).map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim()));
    }

    async function importMasterRows(type, rows) {
      if (!rows || rows.length === 0) {
        showToast('Tidak ada baris data yang ditemukan pada berkas.', 'warning');
        return;
      }
      const headerIdx = rows.findIndex(r =>
        r.some(c => /kode_mapel|nama_mata_pelajaran|kode_rombel|nama_rombel/i.test(String(c || '')))
      );
      const startIdx = headerIdx >= 0 ? headerIdx + 1 : 0;
      let added = 0;

      for (let i = startIdx; i < rows.length; i++) {
        const cols = rows[i].map(c => String(c || '').trim());
        if (!cols[0] || !cols[1]) continue;
        if (/^(template|petunjuk|kode_)/i.test(cols[0])) continue;

        if (type === 'mapel') {
          await dbSaveDoc('mapels', 'mpl_' + Date.now() + '_' + i, {
            kode: cols[0].toUpperCase(),
            nama: cols[1],
            kelompok: cols[2] || 'Umum',
            kkm: Number(cols[3]) || 75
          }, 'mapels');
          added++;
        } else {
          await dbSaveDoc('rombels', 'rmb_' + Date.now() + '_' + i, {
            kode: cols[0].toUpperCase(),
            nama: cols[1],
            tingkat: cols[2] || '7',
            waliKelas: cols[3] || '-'
          }, 'rombels');
          added++;
        }
      }

      if (added > 0) {
        showToast(`Berhasil mengimpor ${added} data ${type === 'mapel' ? 'Mata Pelajaran' : 'Rombel'}!`, 'success');
        renderApp();
      } else {
        showToast('Tidak ada baris valid yang diimpor. Periksa urutan kolom template.', 'warning');
      }
    }

    async function extractTextFromWordOrDocFile(file) {
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.docx')) {
        if (!window.JSZip) throw new Error('Pustaka pembaca .docx belum siap.');
        const buf = await file.arrayBuffer();
        const zip = await window.JSZip.loadAsync(buf);
        const docFile = zip.file('word/document.xml');
        if (!docFile) throw new Error('Isi dokumen .docx tidak ditemukan.');
        const xml = await docFile.async('text');
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        const paragraphs = [];
        doc.querySelectorAll('p').forEach(p => {
          const line = Array.from(p.querySelectorAll('t')).map(t => t.textContent || '').join('');
          if (line.trim()) paragraphs.push(line.trim());
        });
        return paragraphs.join('\n');
      }

      const raw = await file.text();
      if (raw.includes('<html') || raw.includes('<body') || raw.includes('<p')) {
        const doc = new DOMParser().parseFromString(raw, 'text/html');
        return doc.body.innerText || doc.body.textContent || '';
      }
      return raw;
    }

    function parseSmartQuestions(rawText) {
      const text = String(rawText || '').replace(/\r\n/g, '\n').trim();
      if (!text) return [];

      const blocks = text.split(/\n(?=(?:Soal\s*)?\d{1,3}[\.\)]\s+)/i).map(b => b.trim()).filter(Boolean);
      const results = [];

      blocks.forEach((block, idx) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        let firstLine = lines[0].replace(/^(?:Soal\s*)?\d{1,3}[\.\)]\s*/i, '').trim();
        let tipe = 'PG';

        const tagMatch = firstLine.match(/^\[(PG|PG_KOMPLEKS|BS|BS_MULTI|MENJODOHKAN|ISIAN|ESAI|MULTIMEDIA)\]\s*/i);
        if (tagMatch) {
          tipe = tagMatch[1].toUpperCase();
          firstLine = firstLine.slice(tagMatch[0].length).trim();
        }

        const qLines = [firstLine];
        const opsi = {};
        const pernyataanMulti = [];
        const kunciMulti = [];
        const pasangan = [];
        const kunciJodoh = {};
        let mediaUrl = '';
        let kunci = '';
        let bobot = 10;

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          const optMatch = line.match(/^([A-E])[\.\)]\s+(.+)$/i);
          const keyMatch = line.match(/^(?:KUNCI|JAWABAN)\s*[:=]\s*(.+)$/i);
          const imgMatch = line.match(/^(?:GAMBAR|MEDIA|URL)\s*[:=]\s*(.+)$/i);
          const bobotMatch = line.match(/^BOBOT\s*[:=]\s*(\d+)/i);
          const bsmMatch = line.match(/^PERNYATAAN\s*[:=]\s*(.+?)\s*\|\s*(Benar|Salah)$/i);
          const jodohMatch = line.match(/^JODOH\s*[:=]\s*(.+?)\s*(?:->|=|\|)\s*(.+)$/i);

          if (optMatch) {
            opsi[optMatch[1].toUpperCase()] = optMatch[2].trim();
          } else if (keyMatch) {
            kunci = keyMatch[1].trim();
          } else if (imgMatch) {
            mediaUrl = imgMatch[1].trim();
          } else if (bobotMatch) {
            bobot = Number(bobotMatch[1]) || 10;
          } else if (bsmMatch) {
            tipe = 'BS_MULTI';
            pernyataanMulti.push(bsmMatch[1].trim());
            kunciMulti.push(bsmMatch[2].trim().toLowerCase() === 'benar' ? 'Benar' : 'Salah');
          } else if (jodohMatch) {
            tipe = 'MENJODOHKAN';
            const k = jodohMatch[1].trim();
            const v = jodohMatch[2].trim();
            pasangan.push({ kiri: k, kanan: v });
            kunciJodoh[k] = v;
          } else if (Object.keys(opsi).length === 0 && !kunci) {
            qLines.push(line);
          }
        }

        const pertanyaan = qLines.join(' ').trim();
        if (!pertanyaan) return;

        if (!tagMatch) {
          if (pasangan.length > 0) tipe = 'MENJODOHKAN';
          else if (pernyataanMulti.length > 0) tipe = 'BS_MULTI';
          else if (/^(benar|salah)$/i.test(kunci) && Object.keys(opsi).length === 0) tipe = 'BS';
          else if (kunci.includes(',') && Object.keys(opsi).length > 0) tipe = 'PG_KOMPLEKS';
          else if (Object.keys(opsi).length === 0) tipe = kunci ? 'ISIAN' : 'ESAI';
          else if (mediaUrl) tipe = 'MULTIMEDIA';
        }

        const qObj = {
          id: 'q_' + Date.now() + '_' + idx + '_' + Math.floor(Math.random() * 1000),
          tipe,
          pertanyaan,
          mediaUrl,
          bobot
        };

        let kunciFinal = kunci;
        if (tipe === 'PG' || tipe === 'MULTIMEDIA') {
          qObj.opsi = { A: opsi.A || '', B: opsi.B || '', C: opsi.C || '', D: opsi.D || '', E: opsi.E || '' };
          kunciFinal = (kunci || 'A').toUpperCase().charAt(0);
        } else if (tipe === 'PG_KOMPLEKS') {
          qObj.opsi = { A: opsi.A || '', B: opsi.B || '', C: opsi.C || '', D: opsi.D || '', E: opsi.E || '' };
          kunciFinal = kunci.split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
        } else if (tipe === 'BS') {
          qObj.opsi = { A: 'Benar', B: 'Salah' };
          kunciFinal = /^s/i.test(kunci) ? 'Salah' : 'Benar';
        } else if (tipe === 'BS_MULTI') {
          qObj.pernyataanMulti = pernyataanMulti;
          kunciFinal = kunciMulti;
        } else if (tipe === 'MENJODOHKAN') {
          qObj.pasangan = pasangan;
          kunciFinal = kunciJodoh;
        }

        results.push({ soal: qObj, kunci: kunciFinal });
      });

      return results;
    }

    // 5. INISIALISASI BACKEND (MODE PREVIEW PERSISTEN & MODE PRODUKSI FIREBASE)
    // =========================================================================
    function attachFirestoreListeners() {
      if (!fbDb || !fbMod) return;
      firestoreUnsubs.forEach(unsub => { try { unsub(); } catch (e) {} });
      firestoreUnsubs = [];

      const bindCollection = (colName, stateKey) => {
        const unsub = fbMod.onSnapshot(fbMod.collection(fbDb, colName), (snap) => {
          state[stateKey] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderApp();
        }, (err) => {
          console.warn(`Firestore listener (${colName}):`, err?.code || err);
        });
        firestoreUnsubs.push(unsub);
      };

      const unsubProfile = fbMod.onSnapshot(fbMod.doc(fbDb, 'madrasah_settings', 'profile'), (snap) => {
        if (snap.exists()) {
          state.madrasah = { ...state.madrasah, ...snap.data() };
          renderApp();
        }
      }, () => {});
      firestoreUnsubs.push(unsubProfile);

      bindCollection('mapels', 'mapels');
      bindCollection('rombels', 'rombels');
      bindCollection('sesi', 'sesiList');
      bindCollection('users', 'users');
      bindCollection('bank_soal', 'bankSoal');
      bindCollection('jadwal_ujian', 'jadwalUjian');
      bindCollection('jadwal_pengawas', 'jadwalPengawas');
      bindCollection('exam_records', 'examRecords');

      const unsubKunci = fbMod.onSnapshot(fbMod.collection(fbDb, 'bank_soal_kunci'), (snap) => {
        const kunciAll = {};
        snap.docs.forEach(d => {
          const data = { ...d.data() };
          delete data.id;
          kunciAll[d.id] = data;
        });
        state.bankSoalKunci = { ...state.bankSoalKunci, ...kunciAll };
      }, () => {});
      firestoreUnsubs.push(unsubKunci);
    }

    async function initBackend() {
      if (IS_PREVIEW || !firebaseConfig.apiKey) {
        restorePreviewSnapshot();
        renderApp();
        return;
      }

      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

        const app = appMod.initializeApp(firebaseConfig);
        fbAuth = authMod.getAuth(app);
        fbDb = fsMod.getFirestore(app);
        fbMod = { ...authMod, ...fsMod };

        try {
          if (!fbAuth.currentUser) {
            await authMod.signInAnonymously(fbAuth);
          }
        } catch (authErr) {
          console.warn('Info Firebase Anonymous Auth:', authErr?.code || authErr);
        }

        attachFirestoreListeners();
      } catch (err) {
        console.warn('Fallback ke mode lokal:', err);
        restorePreviewSnapshot();
        renderApp();
      }
    }

    function bindLoginEvents() {
      document.querySelectorAll('[data-login-role]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginRoleTab = btn.getAttribute('data-login-role');
          renderApp();
        });
      });

      document.getElementById('btn-toggle-pass')?.addEventListener('click', () => {
        const inp = document.getElementById('inp-login-pass');
        if (!inp) return;
        inp.removeAttribute('readonly');
        inp.type = inp.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('form-login')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = state.loginRoleTab || 'admin';
        const uidInput = (document.getElementById('inp-login-user')?.value || '').trim();
        const passInput = document.getElementById('inp-login-pass')?.value || '';

        if (!uidInput || !passInput) {
          showToast('Silakan isi username/email dan kata sandi terlebih dahulu.', 'warning');
          return;
        }

        // MODE PRODUKSI FIREBASE (IS_PREVIEW = false)
        if (!IS_PREVIEW) {
          if (!firebaseConfig.apiKey || !fbAuth || !fbMod) {
            showToast('Konfigurasi firebaseConfig belum diisi pada file HTML.', 'error');
            return;
          }

          if (role === 'admin') {
            const existingAdmin = state.users.find(u =>
              u.role === 'admin' &&
              (u.username?.toLowerCase() === uidInput.toLowerCase() || u.email?.toLowerCase() === uidInput.toLowerCase())
            );
            const emailToUse = uidInput.includes('@') ? uidInput : (existingAdmin?.email || '');
            if (!emailToUse) {
              showToast('Masukkan alamat Email Admin yang terdaftar di Firebase Authentication.', 'warning');
              return;
            }

            try {
              const cred = await fbMod.signInWithEmailAndPassword(fbAuth, emailToUse, passInput);
              attachFirestoreListeners();

              let adminProfile = existingAdmin;
              if (!adminProfile && fbDb) {
                const usersSnap = await fbMod.getDocs(fbMod.collection(fbDb, 'users'));
                const allDocs = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                adminProfile = allDocs.find(u =>
                  u.role === 'admin' &&
                  (u.email?.toLowerCase() === cred.user.email?.toLowerCase() || u.uid === cred.user.uid)
                );
              }

              if (!adminProfile) {
                const newAdminId = 'usr_admin_' + cred.user.uid;
                adminProfile = {
                  id: newAdminId,
                  uid: cred.user.uid,
                  role: 'admin',
                  username: (cred.user.email || 'admin').split('@')[0],
                  email: cred.user.email || emailToUse,
                  nama: cred.user.displayName || 'Administrator Utama',
                  nip: '-',
                  password: passInput,
                  aktif: true
                };
                await dbSaveDoc('users', newAdminId, adminProfile, 'users');

                const profSnap = await fbMod.getDoc(fbMod.doc(fbDb, 'madrasah_settings', 'profile'));
                if (!profSnap.exists()) {
                  await dbSaveDoc('madrasah_settings', 'profile', state.madrasah);
                }
              }

              state.currentUser = adminProfile;
              state.activeMenu = 'dashboard';
              saveSessionState();
              showToast(`Selamat datang, ${adminProfile.nama}!`, 'success');
              renderApp();
            } catch (authErr) {
              const code = authErr?.code || '';
              if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
                showToast('Email atau kata sandi Admin salah di Firebase Authentication.', 'error');
              } else if (code === 'auth/invalid-email') {
                showToast('Format alamat Email Admin tidak valid.', 'error');
              } else if (code === 'auth/too-many-requests') {
                showToast('Terlalu banyak percobaan login. Silakan tunggu beberapa saat.', 'error');
              } else {
                showToast('Gagal login Admin: ' + (authErr?.message || code), 'error');
              }
            }
            return;
          }

          try {
            if (!fbAuth.currentUser) {
              await fbMod.signInAnonymously(fbAuth);
              attachFirestoreListeners();
            }
            if (state.users.length === 0 && fbDb) {
              const snap = await fbMod.getDocs(fbMod.collection(fbDb, 'users'));
              state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }
          } catch (anonErr) {
            if (anonErr?.code === 'auth/admin-restricted-operation') {
              showToast('Penyedia login Anonymous di Firebase Authentication belum diaktifkan oleh Admin.', 'error');
              return;
            }
          }
        }

        const matchedUser = state.users.find(u =>
          u.role === role &&
          (u.username.toLowerCase() === uidInput.toLowerCase() || (u.email && u.email.toLowerCase() === uidInput.toLowerCase()))
        );

        if (!matchedUser) {
          showToast('Akun tidak ditemukan pada peran ' + role.toUpperCase() + '.', 'error');
          return;
        }

        if (matchedUser.aktif === false) {
          showToast('Akun ini sedang dinonaktifkan oleh Administrator.', 'error');
          return;
        }

        if (matchedUser.passwordHash) {
          const hashed = await hashPasswordSHA256(passInput);
          const plainMatch = matchedUser.password && passInput === matchedUser.password;
          if (hashed !== matchedUser.passwordHash && !plainMatch && (IS_PREVIEW ? passInput !== '123456' : true)) {
            showToast('Kata sandi salah!', 'error');
            return;
          }
        } else if (matchedUser.password) {
          if (passInput !== matchedUser.password) {
            showToast('Kata sandi salah!', 'error');
            return;
          }
        } else if (passInput.length < 4) {
          showToast('Kata sandi minimal 4 karakter.', 'warning');
          return;
        }

        state.currentUser = matchedUser;
        state.activeMenu = 'dashboard';
        saveSessionState();
        showToast(`Selamat datang, ${matchedUser.nama}!`, 'success');
        renderApp();
      });
    }

    function openEditUserModal(userId) {
      const root = document.getElementById('modal-root');
      const u = state.users.find(x => x.id === userId);
      if (!root || !u) return;

      root.innerHTML = `
        <div class="pointer-events-auto fixed inset-0 z-[2147483646] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
          <form id="form-edit-user" class="neu-card-static w-full max-w-lg rounded-3xl p-6 space-y-3.5 text-xs max-h-[92dvh] overflow-y-auto">
            <div class="flex items-center justify-between">
              <h3 class="text-base font-extrabold text-slate-800">✏️ Edit Akun ${esc(u.role.toUpperCase())}</h3>
              <button type="button" id="btn-close-edit-user" class="px-3 py-1 rounded-xl bg-slate-100 font-bold cursor-pointer">✕</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-600 mb-1">Nama Lengkap</label>
                <input name="nama" value="${esc(u.nama)}" required class="neu-input w-full px-3.5 py-2.5 rounded-xl font-bold" />
              </div>
              <div>
                <label class="block font-bold text-slate-600 mb-1">${u.role === 'siswa' ? 'Nomor Peserta' : 'Username'}</label>
                <input name="username" value="${esc(u.username)}" required class="neu-input w-full px-3.5 py-2.5 rounded-xl font-mono font-bold" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-600 mb-1">${u.role === 'siswa' ? 'NISN' : 'NIP / NUPTK'}</label>
                <input name="nomorInduk" value="${esc(u.role === 'siswa' ? (u.nisn || '') : (u.nip || ''))}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-mono" />
              </div>
              <div>
                <label class="block font-bold text-slate-600 mb-1">Password Login</label>
                <input name="password" value="${esc(u.password || '123456')}" required class="neu-input w-full px-3.5 py-2.5 rounded-xl font-mono font-extrabold text-emerald-700" />
              </div>
            </div>

            ${u.role === 'admin' ? `
              <div>
                <label class="block font-bold text-slate-600 mb-1">Email Administrator (Firebase Auth)</label>
                <input type="email" name="email" value="${esc(u.email || '')}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-mono" />
              </div>
            ` : u.role === 'siswa' ? `
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold text-slate-600 mb-1">Rombel / Kelas</label>
                  <select name="rombelId" class="neu-input w-full px-3 py-2.5 rounded-xl font-bold">
                    ${state.rombels.map(r => `<option value="${esc(r.id)}" ${u.rombelId === r.id ? 'selected' : ''}>${esc(r.kode)} — ${esc(r.nama)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block font-bold text-slate-600 mb-1">Ruang Ujian</label>
                  <input name="ruang" value="${esc(u.ruang || 'Lab Komputer 01')}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-bold" />
                </div>
              </div>
            ` : u.role === 'guru' ? `
              <div>
                <label class="block font-bold text-slate-600 mb-1">Mata Pelajaran</label>
                <select name="mapelKode" class="neu-input w-full px-3 py-2.5 rounded-xl font-bold">
                  ${state.mapels.map(m => `<option value="${esc(m.kode)}" ${u.mapelKode === m.kode ? 'selected' : ''}>${esc(m.kode)} — ${esc(m.nama)}</option>`).join('')}
                </select>
              </div>
            ` : `
              <div>
                <label class="block font-bold text-slate-600 mb-1">Ruang Tugas Pengawas</label>
                <input name="ruang" value="${esc(u.ruang || 'Lab Komputer 01')}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-bold" />
              </div>
            `}

            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center gap-2 font-bold text-slate-700 cursor-pointer">
                <input type="checkbox" name="aktif" ${u.aktif !== false ? 'checked' : ''} class="accent-blue-600 w-4 h-4" />
                <span>Status Akun Aktif</span>
              </label>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="btn-cancel-edit-user" class="px-4 py-2 rounded-xl bg-slate-100 font-bold cursor-pointer">Batal</button>
              <button type="submit" class="neu-btn-blue px-5 py-2 rounded-xl font-extrabold cursor-pointer">💾 Simpan Perubahan</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('btn-close-edit-user')?.addEventListener('click', closeModal);
      document.getElementById('btn-cancel-edit-user')?.addEventListener('click', closeModal);
      document.getElementById('form-edit-user')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newPass = String(fd.get('password') || '123456').trim();
        const passwordHash = await hashPasswordSHA256(newPass);

        const updated = {
          ...u,
          nama: String(fd.get('nama')).trim(),
          username: String(fd.get('username')).trim(),
          password: newPass,
          passwordHash,
          aktif: fd.get('aktif') === 'on'
        };

        if (u.role === 'siswa') {
          updated.nisn = String(fd.get('nomorInduk') || '').trim();
          updated.rombelId = String(fd.get('rombelId') || u.rombelId);
          updated.ruang = String(fd.get('ruang') || 'Lab Komputer 01').trim();
        } else if (u.role === 'guru') {
          updated.nip = String(fd.get('nomorInduk') || '').trim();
          updated.mapelKode = String(fd.get('mapelKode') || u.mapelKode);
        } else if (u.role === 'pengawas') {
          updated.nip = String(fd.get('nomorInduk') || '').trim();
          updated.ruang = String(fd.get('ruang') || 'Lab Komputer 01').trim();
        } else {
          updated.nip = String(fd.get('nomorInduk') || '').trim();
          updated.email = String(fd.get('email') || u.email || '').trim();
        }

        await dbSaveDoc('users', u.id, updated, 'users');
        if (state.currentUser?.id === u.id) {
          state.currentUser = updated;
          saveSessionState();
        }
        closeModal();
        showToast(`Data akun "${updated.nama}" berhasil diperbarui!`, 'success');
        renderApp();
      });
    }

    // =========================================================================
    // 15. VIEW MONITORING & HASIL NILAI UJIAN REAL-TIME
    // =========================================================================
    function getResolvedStudentScore(jad, rec) {
      if (!rec) return null;
      if (rec.skor !== undefined && rec.skor !== null && !Number.isNaN(Number(rec.skor))) {
        return Number(rec.skor);
      }
      if (rec.answers && Object.keys(rec.answers).length > 0) {
        return calculateExamScore(jad, rec.answers);
      }
      return 0;
    }

    function openStudentScoreDetailModal(jadwalId, siswaId) {
      const root = document.getElementById('modal-root');
      const jad = state.jadwalUjian.find(j => j.id === jadwalId);
      const siswa = state.users.find(u => u.id === siswaId);
      if (!root || !jad || !siswa) return;

      const paket = state.bankSoal.find(b => b.id === jad.bankSoalId);
      const soalList = paket?.soalList || [];
      const kunciMap = paket ? (state.bankSoalKunci[paket.id] || {}) : {};
      const recId = `rec_${jad.id}_${siswa.id}`;
      const rec = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === siswa.id) || {
        id: recId,
        jadwalId: jad.id,
        siswaId: siswa.id,
        status: 'belum_mulai',
        skor: 0,
        pelanggaran: 0,
        answers: {}
      };
      const autoSkor = calculateExamScore(jad, rec.answers || {});
      const currentSkor = getResolvedStudentScore(jad, rec) ?? autoSkor;

      root.innerHTML = `
        <div class="pointer-events-auto fixed inset-0 z-[2147483646] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5">
          <div class="neu-card-static w-full max-w-3xl max-h-[92dvh] flex flex-col rounded-3xl overflow-hidden text-xs">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
              <div>
                <h3 class="text-base font-extrabold text-slate-800">📊 Detail Jawaban & Hasil Nilai Siswa</h3>
                <p class="text-[11px] text-slate-500">${esc(siswa.nama)} (${esc(siswa.username)}) • ${esc(jad.namaUjian)}</p>
              </div>
              <button type="button" id="btn-close-score-detail" class="px-3 py-1.5 rounded-xl bg-white border border-slate-200 font-bold cursor-pointer">✕ Tutup</button>
            </div>

            <div class="p-5 overflow-y-auto flex-1 space-y-4">
              <form id="form-manual-score-override" class="p-4 rounded-2xl bg-blue-50/70 border border-blue-200/80 flex flex-wrap items-end justify-between gap-3">
                <div class="space-y-1">
                  <div class="text-[11px] font-bold text-blue-700">Nilai Otomatis Sistem: <span class="font-extrabold">${autoSkor}</span></div>
                  <div class="text-[11px] text-slate-500">Anda dapat menyesuaikan nilai akhir (misal setelah koreksi soal Esai) dan menandai ujian selesai.</div>
                </div>
                <div class="flex items-center gap-2">
                  <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Nilai Akhir (0–100)</label>
                    <input type="number" name="skorManual" min="0" max="100" value="${currentSkor}" required class="neu-input w-24 px-3 py-2 rounded-xl font-extrabold text-center text-sm text-blue-700" />
                  </div>
                  <button type="submit" class="neu-btn-blue px-4 py-2.5 rounded-xl font-extrabold cursor-pointer">💾 Simpan Nilai</button>
                </div>
              </form>

              <div class="space-y-2.5">
                <div class="font-extrabold text-slate-700">Rincian Jawaban (${soalList.length} Butir Soal)</div>
                ${soalList.length === 0 ? `
                  <div class="p-6 text-center text-slate-400">Paket soal tidak ditemukan.</div>
                ` : soalList.map((q, idx) => {
                  const ans = rec.answers?.[q.id];
                  const key = kunciMap[q.id] !== undefined ? kunciMap[q.id] : q.kunci;
                  const ansStr = ans === undefined || ans === '' ? '(Tidak dijawab)' : (typeof ans === 'object' ? JSON.stringify(ans) : String(ans));
                  const keyStr = key === undefined || key === '' ? '-' : (typeof key === 'object' ? JSON.stringify(key) : String(key));
                  const isCorrect = ans !== undefined && ans !== '' && key !== undefined && (
                    typeof ans === 'object' ? JSON.stringify(ans) === JSON.stringify(key) : String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()
                  );
                  return `
                    <div class="p-3.5 rounded-2xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/40' : 'border-slate-200 bg-white'} space-y-1">
                      <div class="flex items-center justify-between gap-2">
                        <span class="font-extrabold text-slate-800">No. ${idx + 1} • ${esc(q.tipe)} (Bobot ${q.bobot || 10})</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                          ${isCorrect ? '✓ Sesuai Kunci' : 'Periksa'}
                        </span>
                      </div>
                      <div class="text-slate-700 font-medium">${esc(q.pertanyaan)}</div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 text-[11px]">
                        <div class="px-2.5 py-1.5 rounded-xl bg-slate-50 border border-slate-200/70">
                          <span class="text-slate-400 font-bold">Jawaban Siswa:</span> <strong class="text-slate-800">${esc(ansStr)}</strong>
                        </div>
                        <div class="px-2.5 py-1.5 rounded-xl bg-emerald-50/70 border border-emerald-200/70">
                          <span class="text-emerald-600 font-bold">Kunci Jawaban:</span> <strong class="text-emerald-800">${esc(keyStr)}</strong>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('btn-close-score-detail')?.addEventListener('click', closeModal);
      document.getElementById('form-manual-score-override')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const skorBaru = Math.max(0, Math.min(100, Number(fd.get('skorManual')) || 0));
        await dbSaveDoc('exam_records', recId, {
          ...rec,
          id: recId,
          jadwalId: jad.id,
          siswaId: siswa.id,
          status: 'selesai',
          skor: skorBaru,
          waktuSelesai: rec.waktuSelesai && rec.waktuSelesai !== '-' ? rec.waktuSelesai : new Date().toTimeString().slice(0, 5)
        }, 'examRecords');
        closeModal();
        showToast(`Nilai akhir ${siswa.nama} berhasil disimpan: ${skorBaru}`, 'success');
        renderApp();
      });
    }

      downloadExcelTemplate(
        `Rekap_Nilai_${jad.mapelKode}_${jad.tanggalMulai}.xls`,
        `REKAPITULASI HASIL NILAI UJIAN — ${jad.namaUjian.toUpperCase()}`,
        ['NO', 'NO_PESERTA', 'NISN', 'NAMA_LENGKAP', 'ROMBEL', 'STATUS', 'TERJAWAB', 'PELANGGARAN', 'NILAI_AKHIR', 'KETERANGAN_KKM'],
        rowsData.map((item, idx) => [
          String(idx + 1),
          item.siswa.username,
          item.siswa.nisn || '-',
          item.siswa.nama,
          item.rombelKode,
          item.status.toUpperCase(),
          `${item.answeredCount}/${item.totalSoal}`,
          `${item.pelanggaran}x`,
          item.nilaiTampil !== null ? String(item.nilaiTampil) : '-',
          item.nilaiTampil !== null ? (item.nilaiTampil >= kkm ? `TUNTAS (KKM ${kkm})` : `REMEDIAL (KKM ${kkm})`) : 'BELUM SELESAI'
        ]),
        `Madrasah: ${state.madrasah.nama} | Mata Pelajaran: ${jad.mapelKode} | Tanggal: ${jad.tanggalMulai} | KKM: ${kkm}`

    function renderMonitoringView() {
      const jad = state.jadwalUjian.find(j => j.id === state.selectedJadwalId) || state.jadwalUjian[0];
      const paket = jad ? state.bankSoal.find(b => b.id === jad.bankSoalId) : null;
      const totalSoal = paket?.soalList?.length || 0;
      const mapelObj = jad ? state.mapels.find(m => m.kode === jad.mapelKode) : null;
      const kkm = Number(mapelObj?.kkm) || 75;

      const allPesertaJadwal = jad
        ? state.users.filter(u =>
            u.role === 'siswa' &&
            ((jad.pesertaIds || []).includes(u.id) || state.examRecords.some(r => r.jadwalId === jad.id && r.siswaId === u.id))
          )
        : [];

      const qSearch = (state.monSearch || '').trim().toLowerCase();
      const filteredPeserta = allPesertaJadwal.filter(s => {
        const matchRombel = state.monRombelFilter === 'ALL' || s.rombelId === state.monRombelFilter;
        const matchSearch = !qSearch || s.nama.toLowerCase().includes(qSearch) || s.username.toLowerCase().includes(qSearch);
        return matchRombel && matchSearch;
      });

      const rowsData = filteredPeserta.map(s => {
        const rmb = state.rombels.find(r => r.id === s.rombelId);
        const rec = state.examRecords.find(r => r.jadwalId === jad?.id && r.siswaId === s.id);
        const status = rec?.status || 'belum_mulai';
        const answeredCount = rec?.answers
          ? Object.values(rec.answers).filter(v => v !== undefined && v !== '' && !(Array.isArray(v) && v.length === 0)).length
          : 0;
        const nilaiTampil = rec ? getResolvedStudentScore(jad, rec) : null;
        return {
          siswa: s,
          rombelKode: rmb?.kode || '-',
          rec,
          status,
          answeredCount,
          totalSoal,
          pelanggaran: rec?.pelanggaran || 0,
          nilaiTampil
        };
      });

      const finishedScores = rowsData.filter(r => r.status === 'selesai' && r.nilaiTampil !== null).map(r => r.nilaiTampil);
      const selesaiTotal = rowsData.filter(r => r.status === 'selesai').length;
      const aktifTotal = rowsData.filter(r => r.status === 'mengerjakan' || r.status === 'terkunci').length;
      const avgScore = finishedScores.length > 0
        ? (finishedScores.reduce((a, b) => a + b, 0) / finishedScores.length).toFixed(1)
        : '-';
      const maxScore = finishedScores.length > 0 ? Math.max(...finishedScores) : '-';

      return `
        <div class="space-y-5">
          <!-- Kartu Statistik Ringkasan Hasil Nilai & Status -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="neu-stat-sky rounded-3xl p-4">
              <div class="text-[11px] font-bold text-slate-500">Total Peserta Jadwal</div>
              <div class="text-2xl font-extrabold text-slate-800 mt-1">${rowsData.length} <span class="text-xs font-semibold text-slate-400">Siswa</span></div>
            </div>
            <div class="neu-stat-mint rounded-3xl p-4">
              <div class="text-[11px] font-bold text-slate-500">Ujian Selesai</div>
              <div class="text-2xl font-extrabold text-emerald-700 mt-1">${selesaiTotal} <span class="text-xs font-semibold text-slate-400">Peserta</span></div>
            </div>
            <div class="neu-stat-teal rounded-3xl p-4">
              <div class="text-[11px] font-bold text-slate-500">Sedang Mengerjakan</div>
              <div class="text-2xl font-extrabold text-amber-700 mt-1">${aktifTotal} <span class="text-xs font-semibold text-slate-400">Peserta</span></div>
            </div>
            <div class="neu-stat-peach rounded-3xl p-4">
              <div class="text-[11px] font-bold text-slate-500">Rata-Rata Nilai (KKM ${kkm})</div>
              <div class="text-2xl font-extrabold text-blue-700 mt-1">${avgScore} <span class="text-[11px] font-bold text-slate-400">Max: ${maxScore}</span></div>
            </div>
          </div>

          <!-- Panel Tabel Monitoring & Hasil Nilai -->
          <div class="neu-card-static rounded-3xl p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="text-base font-extrabold text-slate-800">Monitoring & Hasil Nilai Ujian Siswa</h3>
                <p class="text-xs text-slate-400">Pantau status pengerjaan, nilai otomatis, koreksi manual, serta ekspor rekap nilai.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" id="btn-recalc-scores" class="px-3.5 py-2 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-extrabold cursor-pointer">
                  🔄 Hitung Ulang Nilai
                </button>
                <button type="button" id="btn-export-nilai-xls" class="neu-btn-emerald px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer">
                  📥 Ekspor Nilai (.xls)
                </button>
              </div>
            </div>

            <!-- Bar Filter Jadwal, Rombel & Pencarian -->
            <div class="flex flex-wrap items-center gap-2.5 pt-1">
              <select id="sel-mon-jadwal" class="neu-input px-3.5 py-2.5 rounded-2xl text-xs font-extrabold">
                ${state.jadwalUjian.map(j => `<option value="${esc(j.id)}" ${jad?.id === j.id ? 'selected' : ''}>${esc(j.namaUjian)} (Token: ${esc(j.token)})</option>`).join('')}
              </select>
              <select id="sel-mon-rombel" class="neu-input px-3.5 py-2.5 rounded-2xl text-xs font-bold">
                <option value="ALL">Semua Rombel</option>
                ${state.rombels.map(r => `<option value="${esc(r.id)}" ${state.monRombelFilter === r.id ? 'selected' : ''}>${esc(r.kode)} — ${esc(r.nama)}</option>`).join('')}
              </select>
              <input id="inp-mon-search" value="${esc(state.monSearch)}" placeholder="Cari nama / no. peserta..." class="neu-input px-3.5 py-2.5 rounded-2xl text-xs w-56" />
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-slate-100 text-slate-400 text-[10px] uppercase">
                    <th class="py-3 px-3">No. Peserta</th>
                    <th class="py-3 px-3">Nama Peserta & Kelas</th>
                    <th class="py-3 px-3">Status</th>

                    <th class="py-3 px-3">Pelanggaran</th>

                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${rowsData.length === 0 ? `
                    <tr>
                      <td colspan="7" class="py-8 text-center text-slate-400">Tidak ada peserta pada jadwal atau filter ini.</td>
                    </tr>
                  ` : rowsData.map(row => {
                    const { siswa: s, rombelKode, status, answeredCount, pelanggaran, nilaiTampil } = row;
                    const badgeMap = {
                      belum_mulai: 'bg-slate-100 text-slate-600',
                      mengerjakan: 'bg-blue-50 text-blue-600',
                      terkunci: 'bg-rose-100 text-rose-700',
                      selesai: 'bg-emerald-100 text-emerald-700'
                    };

                    let nilaiHtml = '<span class="text-slate-400 font-bold">-</span>';
                    if (status === 'selesai' && nilaiTampil !== null) {
                      const lulus = nilaiTampil >= kkm;
                      nilaiHtml = `
                        <div class="inline-flex items-center gap-1.5">
                          <span class="px-3 py-1 rounded-xl font-extrabold text-sm ${lulus ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-700 border border-rose-200'}">
                            ${nilaiTampil}
                          </span>
                          <span class="text-[10px] font-extrabold ${lulus ? 'text-emerald-600' : 'text-rose-600'}">
                            ${lulus ? 'Tuntas' : 'Remedial'}
                          </span>
                        </div>
                      `;
                    } else if ((status === 'mengerjakan' || status === 'terkunci') && nilaiTampil !== null) {
                      nilaiHtml = `
                        <div class="inline-flex flex-col">
                          <span class="px-2.5 py-0.5 rounded-lg bg-amber-50 border border-amber-200 font-extrabold text-amber-800 w-fit">
                            ${nilaiTampil}
                          </span>
                          <span class="text-[9px] font-bold text-slate-400 mt-0.5">Skor Sementara</span>
                        </div>
                      `;
                    }

                    return `
                      <tr class="hover:bg-slate-50">
                        <td class="py-3 px-3 font-mono font-bold text-slate-700">${esc(s.username)}</td>
                        <td class="py-3 px-3">
                          <div class="font-extrabold text-slate-800">${esc(s.nama)}</div>
                          <div class="text-[10px] text-slate-400 font-semibold">Kelas: ${esc(rombelKode)} ${s.nisn ? `• NISN: ${esc(s.nisn)}` : ''}</div>
                        </td>
                        <td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full font-bold text-[10px] uppercase ${badgeMap[status] || badgeMap.belum_mulai}">${esc(status.replace('_', ' '))}</span></td>
                        <td class="py-3 px-3 font-bold text-slate-600">${answeredCount}/${totalSoal} Soal</td>
                        <td class="py-3 px-3 font-bold ${pelanggaran > 0 ? 'text-rose-600' : 'text-slate-400'}">${pelanggaran}x</td>
                        <td class="py-3 px-3">${nilaiHtml}</td>
                        <td class="py-3 px-3 text-right space-x-1 whitespace-nowrap">
                          <button type="button" data-detail-nilai-siswa="${esc(s.id)}" data-jad-id="${esc(jad.id)}" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 font-bold cursor-pointer">Detail / Nilai</button>

                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>

    async function requestSafeFullscreen() {
      try {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          await el.requestFullscreen();
        }
      } catch (e) {}
    }

    async function launchStudentExamSession(jad) {
      await requestSafeFullscreen();
      const recId = `rec_${jad.id}_${state.currentUser.id}`;
      const existing = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === state.currentUser.id);
      const rec = existing || {
        id: recId,
        jadwalId: jad.id,
        siswaId: state.currentUser.id,
        status: 'mengerjakan',
        skor: 0,
        pelanggaran: 0,
        waktuMulai: new Date().toTimeString().slice(0, 5),
        waktuSelesai: '-',
        answers: {}
      };
      rec.status = 'mengerjakan';
      await dbSaveDoc('exam_records', recId, rec, 'examRecords');

      state.activeExamSession = {
        jadwalId: jad.id,
        remainingSec: (jad.durasiMenit || 90) * 60,
        answers: rec.answers || {},
        raguIds: [],
        violations: rec.pelanggaran || 0
      };
      state.currentQuestionIndex = 0;
      saveSessionState();
      renderApp();
    }

    function calculateExamScore(jad, answers) {
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const kunciMap = paket ? (state.bankSoalKunci[paket.id] || {}) : {};
      if (!paket || !paket.soalList || paket.soalList.length === 0) return 0;

      let totalBobot = 0;
      let earned = 0;

      paket.soalList.forEach(q => {
        const w = Number(q.bobot) || 10;
        totalBobot += w;
        const ans = answers?.[q.id];
        const key = kunciMap[q.id] !== undefined ? kunciMap[q.id] : q.kunci;
        if (ans === undefined || ans === '' || key === undefined || key === '') return;

        if (q.tipe === 'PG' || q.tipe === 'MULTIMEDIA' || q.tipe === 'BS') {
          if (String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()) earned += w;
        } else if (q.tipe === 'PG_KOMPLEKS') {
          const aArr = Array.isArray(ans) ? ans.map(x => String(x).trim().toUpperCase()) : [];
          const kArr = Array.isArray(key)
            ? key.map(x => String(x).trim().toUpperCase())
            : String(key).split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
          const aSet = new Set(aArr);
          const kSet = new Set(kArr);
          if (kSet.size > 0 && aSet.size === kSet.size && [...kSet].every(x => aSet.has(x))) earned += w;
        } else if (q.tipe === 'BS_MULTI') {
          const aArr = Array.isArray(ans) ? ans : [];
          const kArr = Array.isArray(key) ? key : [];
          if (kArr.length > 0) {
            let correctCount = 0;
            kArr.forEach((kVal, idx) => {
              if (String(aArr[idx] || '').trim().toLowerCase() === String(kVal || '').trim().toLowerCase()) {
                correctCount++;
              }
            });
            earned += (w * correctCount) / kArr.length;
          }
        } else if (q.tipe === 'ISIAN') {
          const accepted = String(key).split('|').map(x => x.trim().toLowerCase()).filter(Boolean);
          if (accepted.includes(String(ans).trim().toLowerCase())) earned += w;
        } else if (q.tipe === 'ESAI') {
          const ansNorm = String(ans).trim().toLowerCase();
          const keyNorm = String(key).trim().toLowerCase();
          if (ansNorm === keyNorm) {
            earned += w;
          } else {
            const keywords = keyNorm.split(/[\s,;]+/).filter(word => word.length >= 4);
            if (keywords.length > 0) {
              const matched = keywords.filter(kw => ansNorm.includes(kw)).length;
              earned += (w * matched) / keywords.length;
            }
          }
        } else if (q.tipe === 'MENJODOHKAN' && typeof ans === 'object' && typeof key === 'object') {
          const keys = Object.keys(key);
          const correct = keys.filter(k => String(ans[k] || '').trim() === String(key[k] || '').trim()).length;
          if (keys.length > 0) earned += (w * correct) / keys.length;
        }
      });

      return totalBobot > 0 ? Math.round((earned / totalBobot) * 100) : 0;
    }

    async function finishStudentExam(forcedByViolation = false) {
      const sess = state.activeExamSession;
      if (!sess) return;
      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const skor = calculateExamScore(jad, sess.answers);
      const recId = `rec_${sess.jadwalId}_${state.currentUser.id}`;
      const existingRec = state.examRecords.find(r => r.id === recId || (r.jadwalId === sess.jadwalId && r.siswaId === state.currentUser.id));

      await dbSaveDoc('exam_records', recId, {
        id: recId,
        jadwalId: sess.jadwalId,
        siswaId: state.currentUser.id,
        status: 'selesai',
        skor,
        pelanggaran: sess.violations || 0,
        waktuMulai: existingRec?.waktuMulai || new Date().toTimeString().slice(0, 5),
        waktuSelesai: new Date().toTimeString().slice(0, 5),
        answers: sess.answers
      }, 'examRecords');

      state.activeExamSession = null;
      saveSessionState();
      try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (e) {}
      showToast(forcedByViolation ? 'Ujian otomatis dihentikan karena batas pelanggaran tercapai.' : 'Jawaban ujian berhasil dikirim!', forcedByViolation ? 'error' : 'success');
      renderApp();
    }

      document.getElementById('form-add-soal')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const paket = state.bankSoal.find(b => b.id === state.selectedBankSoalId) || state.bankSoal[0];
        if (!paket) return;
        const fd = new FormData(e.target);
        const tipe = String(fd.get('tipe'));
        const qId = 'q_' + Date.now();
        const qObj = {
          id: qId,
          tipe,
          pertanyaan: String(fd.get('pertanyaan')).trim(),
          mediaUrl: String(fd.get('mediaUrl') || '').trim(),
          bobot: Number(fd.get('bobot')) || 10
        };
        let kunciVal = '';

        if (tipe === 'PG' || tipe === 'MULTIMEDIA') {
          qObj.opsi = {
            A: String(fd.get('opsi_A') || ''),
            B: String(fd.get('opsi_B') || ''),
            C: String(fd.get('opsi_C') || ''),
            D: String(fd.get('opsi_D') || ''),
            E: String(fd.get('opsi_E') || '')
          };
          kunciVal = String(fd.get('kunci_pg') || 'A');
        } else if (tipe === 'PG_KOMPLEKS') {
          qObj.opsi = {
            A: String(fd.get('opsi_A') || ''),
            B: String(fd.get('opsi_B') || ''),
            C: String(fd.get('opsi_C') || ''),
            D: String(fd.get('opsi_D') || ''),
            E: String(fd.get('opsi_E') || '')
          };
          kunciVal = fd.getAll('kunci_pgk');
        } else if (tipe === 'BS') {
          qObj.opsi = { A: 'Benar', B: 'Salah' };
          kunciVal = String(fd.get('kunci_bs') || 'Benar');
        } else if (tipe === 'BS_MULTI') {
          qObj.pernyataanMulti = [1, 2, 3].map(n => String(fd.get(`bsm_teks_${n}`) || '').trim()).filter(Boolean);
          kunciVal = [1, 2, 3].map(n => String(fd.get(`bsm_kunci_${n}`) || 'Benar')).slice(0, qObj.pernyataanMulti.length);
        } else if (tipe === 'MENJODOHKAN') {
          qObj.pasangan = [];
          kunciVal = {};
          [1, 2, 3].forEach(n => {
            const k = String(fd.get(`jodoh_kiri_${n}`) || '').trim();
            const v = String(fd.get(`jodoh_kanan_${n}`) || '').trim();
            if (k && v) {
              qObj.pasangan.push({ kiri: k, kanan: v });
              kunciVal[k] = v;
            }
          });
        } else {
          kunciVal = String(fd.get('kunci_teks') || '').trim();
        }

        paket.soalList.push(qObj);
        if (!state.bankSoalKunci[paket.id]) state.bankSoalKunci[paket.id] = {};
        state.bankSoalKunci[paket.id][qId] = kunciVal;

        await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');
        await dbSaveDoc('bank_soal_kunci', paket.id, state.bankSoalKunci[paket.id]);
        showToast('Butir soal berhasil disimpan!', 'success');
        renderApp();

      // Jadwal Pengawas

      document.getElementById('inp-mon-search')?.addEventListener('input', (e) => {

      document.querySelectorAll('[data-detail-nilai-siswa]').forEach(btn => {

          openStudentScoreDetailModal(btn.getAttribute('data-jad-id'), btn.getAttribute('data-detail-nilai-siswa'));
        });
      });

      document.getElementById('btn-recalc-scores')?.addEventListener('click', async () => {
        const jad = state.jadwalUjian.find(j => j.id === state.selectedJadwalId) || state.jadwalUjian[0];
        if (!jad) return;
        const recs = state.examRecords.filter(r => r.jadwalId === jad.id);
        let updatedCount = 0;
        for (const r of recs) {
          const newSkor = calculateExamScore(jad, r.answers || {});
          await dbSaveDoc('exam_records', r.id, { ...r, skor: newSkor }, 'examRecords');
          updatedCount++;
        }
        showToast(updatedCount > 0 ? `Nilai ${updatedCount} peserta berhasil dihitung ulang!` : 'Belum ada data pengerjaan untuk dihitung ulang.', updatedCount > 0 ? 'success' : 'info');
        renderApp();
      });

      document.getElementById('btn-export-nilai-xls')?.addEventListener('click', () => {
        const jad = state.jadwalUjian.find(j => j.id === state.selectedJadwalId) || state.jadwalUjian[0];
        if (!jad) return;
        const paket = state.bankSoal.find(b => b.id === jad.bankSoalId);
        const totalSoal = paket?.soalList?.length || 0;
        const mapelObj = state.mapels.find(m => m.kode === jad.mapelKode);
        const kkm = Number(mapelObj?.kkm) || 75;
        const peserta = state.users.filter(u =>
          u.role === 'siswa' &&
          ((jad.pesertaIds || []).includes(u.id) || state.examRecords.some(r => r.jadwalId === jad.id && r.siswaId === u.id))
        );
        const rowsData = peserta.map(s => {
          const rmb = state.rombels.find(r => r.id === s.rombelId);
          const rec = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === s.id);
          const status = rec?.status || 'belum_mulai';
          const answeredCount = rec?.answers ? Object.values(rec.answers).filter(v => v !== undefined && v !== '').length : 0;
          return {
            siswa: s,
            rombelKode: rmb?.kode || '-',
            status,
            answeredCount,
            totalSoal,
            pelanggaran: rec?.pelanggaran || 0,
            nilaiTampil: rec ? getResolvedStudentScore(jad, rec) : null
          };
        });
        exportNilaiToExcel(jad, rowsData, kkm);
      });

      document.querySelectorAll('[data-exam-ctrl]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const action = btn.getAttribute('data-exam-ctrl');
          const jid = btn.getAttribute('data-jad-id');
          const sid = btn.getAttribute('data-siswa-id');
          const jad = state.jadwalUjian.find(j => j.id === jid);
          const recId = `rec_${jid}_${sid}`;
          const rec = state.examRecords.find(r => r.jadwalId === jid && r.siswaId === sid) || {
            id: recId, jadwalId: jid, siswaId: sid, status: 'belum_mulai', skor: 0, pelanggaran: 0, answers: {}
          };

          if (action === 'hentikan') rec.status = 'terkunci';
          else if (action === 'reset_login') rec.status = 'mengerjakan';
          else if (action === 'selesaikan') {
            rec.status = 'selesai';
            rec.skor = calculateExamScore(jad, rec.answers);
          } else if (action === 'reset_ujian') {
            rec.status = 'belum_mulai';
            rec.skor = 0;
            rec.pelanggaran = 0;
            rec.answers = {};
          }
          await dbSaveDoc('exam_records', recId, rec, 'examRecords');
          showToast('Status ujian peserta diperbarui!', 'success');
          renderApp();

      // Dokumen Berita Acara & Daftar Hadir

        Object.assign(state.beritaAcaraManual, Object.fromEntries(fd.entries()));

      document.getElementById('btn-export-dok-word')?.addEventListener('click', () => {

        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8" /></head><body>${area.innerHTML}</body></html>`;
        const blob = new Blob(['\uFEFF' + html], { type: 'application/msword;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.dokumenTab}_${state.paperSize}.doc`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Dokumen Word (.doc) berhasil diunduh!', 'success');
      });

      // Backup & Restore JSON
      document.getElementById('btn-download-backup')?.addEventListener('click', () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          madrasah: state.madrasah,
          mapels: state.mapels,
          rombels: state.rombels,
          sesiList: state.sesiList,
          users: state.users,
          bankSoal: state.bankSoal,
          bankSoalKunci: state.bankSoalKunci,
          jadwalUjian: state.jadwalUjian,
          jadwalPengawas: state.jadwalPengawas,
          examRecords: state.examRecords
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Backup_CBT_Madrasah_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Cadangan database berhasil diunduh!', 'success');
      });

      document.getElementById('inp-restore-backup')?.addEventListener('change', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          const data = JSON.parse(await f.text());
          if (data.madrasah) state.madrasah = data.madrasah;
          if (Array.isArray(data.mapels)) state.mapels = data.mapels;
          if (Array.isArray(data.rombels)) state.rombels = data.rombels;
          if (Array.isArray(data.sesiList)) state.sesiList = data.sesiList;
          if (Array.isArray(data.users)) state.users = data.users;
          if (Array.isArray(data.bankSoal)) state.bankSoal = data.bankSoal;
          if (data.bankSoalKunci) state.bankSoalKunci = data.bankSoalKunci;
          if (Array.isArray(data.jadwalUjian)) state.jadwalUjian = data.jadwalUjian;
          if (Array.isArray(data.jadwalPengawas)) state.jadwalPengawas = data.jadwalPengawas;
          if (Array.isArray(data.examRecords)) state.examRecords = data.examRecords;
          savePreviewSnapshot();
          showToast('Database berhasil dipulihkan!', 'success');
          renderApp();
        } catch (err) {
          showToast('Berkas JSON cadangan tidak valid.', 'error');
        }
      });
    }

    function bindStudentEvents() {
      document.querySelectorAll('[data-start-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          openExamTokenModal(btn.getAttribute('data-start-exam'));
        });
      });

      const sess = state.activeExamSession;
      if (!sess) return;
      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const soalList = paket?.soalList || [];
      const curQ = soalList[Math.min(state.currentQuestionIndex, Math.max(0, soalList.length - 1))];

      const saveCurrentAnswer = async (val) => {
        if (!curQ) return;
        sess.answers[curQ.id] = val;
        saveSessionState();
        const recId = `rec_${sess.jadwalId}_${state.currentUser.id}`;
        const existingRec = state.examRecords.find(r => r.id === recId || (r.jadwalId === sess.jadwalId && r.siswaId === state.currentUser.id));
        const liveSkor = calculateExamScore(jad, sess.answers);
        await dbSaveDoc('exam_records', recId, {
          id: recId,
          jadwalId: sess.jadwalId,
          siswaId: state.currentUser.id,
          status: 'mengerjakan',
          skor: liveSkor,
          pelanggaran: sess.violations || 0,
          waktuMulai: existingRec?.waktuMulai || new Date().toTimeString().slice(0, 5),
          answers: sess.answers
        }, 'examRecords');
      };

      document.querySelectorAll('input[name="ans_pg"]').forEach(r => {
        r.addEventListener('change', async () => {
          await saveCurrentAnswer(r.value);
          renderApp();
        });
      });

      document.querySelectorAll('.ans-pgk').forEach(chk => {
        chk.addEventListener('change', async () => {
          const vals = Array.from(document.querySelectorAll('.ans-pgk:checked')).map(c => c.value);
          await saveCurrentAnswer(vals);
          renderApp();
        });
      });

      document.querySelectorAll('input[name="ans_bs"]').forEach(r => {
        r.addEventListener('change', async () => {
          await saveCurrentAnswer(r.value);
          renderApp();
        });
      });

      document.querySelectorAll('[data-bsm-idx]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const idx = Number(btn.getAttribute('data-bsm-idx'));
          const val = btn.getAttribute('data-bsm-val');
          const arr = Array.isArray(sess.answers[curQ.id]) ? [...sess.answers[curQ.id]] : [];
          arr[idx] = val;
          await saveCurrentAnswer(arr);
          renderApp();
        });
      });

      document.querySelectorAll('.ans-jodoh').forEach(sel => {
        sel.addEventListener('change', async () => {
          const kiri = sel.getAttribute('data-jodoh-kiri');
          const map = (sess.answers[curQ.id] && typeof sess.answers[curQ.id] === 'object') ? { ...sess.answers[curQ.id] } : {};
          map[kiri] = sel.value;
          await saveCurrentAnswer(map);
        });
      });

      document.getElementById('ans-teks-input')?.addEventListener('input', async (e) => {
        await saveCurrentAnswer(e.target.value);
      });

      document.getElementById('btn-prev-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex > 0) {
          state.currentQuestionIndex--;
          saveSessionState();
          renderApp();
        }
      });

      document.getElementById('btn-next-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex < soalList.length - 1) {
          state.currentQuestionIndex++;
          saveSessionState();
          renderApp();
        }
      });

      document.querySelectorAll('[data-jump-soal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentQuestionIndex = Number(btn.getAttribute('data-jump-soal'));
          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('btn-toggle-ragu')?.addEventListener('click', () => {
        if (!curQ) return;
        const list = sess.raguIds || [];
        sess.raguIds = list.includes(curQ.id) ? list.filter(x => x !== curQ.id) : [...list, curQ.id];
        saveSessionState();
        renderApp();
      });

      document.getElementById('btn-trigger-fullscreen')?.addEventListener('click', requestSafeFullscreen);

      const triggerFinishConfirm = () => {
        openConfirmModal('Kirim Jawaban Ujian', 'Apakah Anda yakin telah memeriksa seluruh jawaban dan ingin mengakhiri ujian ini?', async () => {
          await finishStudentExam(false);
        });
      };
      document.getElementById('btn-finish-exam')?.addEventListener('click', triggerFinishConfirm);
      document.getElementById('btn-finish-exam-side')?.addEventListener('click', triggerFinishConfirm);
    }

    function renderApp() {
      isolateViewportFromBlogger();
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!state.currentUser) {
        root.innerHTML = renderLoginView();
        bindLoginEvents();
        return;
      }

      if (state.currentUser.role === 'siswa') {
        root.innerHTML = renderStudentPortalView();
        bindGlobalEvents();
        bindStudentEvents();
        return;
      }

      let viewHtml = '';
      switch (state.activeMenu) {
        case 'madrasah': viewHtml = renderMadrasahView(); break;
        case 'master': viewHtml = renderMasterView(); break;
        case 'users': viewHtml = renderUsersView(); break;
        case 'kartu_peserta': viewHtml = renderKartuPesertaView(); break;
        case 'bank_soal': viewHtml = renderBankSoalView(); break;
        case 'jadwal': viewHtml = renderJadwalView(); break;
        case 'jadwal_pengawas': viewHtml = renderJadwalPengawasView(); break;
        case 'monitoring': viewHtml = renderMonitoringView(); break;
        case 'dokumen': viewHtml = renderDokumenView(); break;
        case 'backup': viewHtml = renderBackupRestoreView(); break;
        default: viewHtml = renderDashboardView();
      }

      root.innerHTML = renderAppShell(viewHtml);
      bindGlobalEvents();
    }

    // =========================================================================
    // 21. TIMER & PERISAI ANTI-CURANG VISIBILITYCHANGE
    // =========================================================================
    setInterval(async () => {
      const sess = state.activeExamSession;
      if (!sess || state.currentUser?.role !== 'siswa') return;
      sess.remainingSec = Math.max(0, (sess.remainingSec || 0) - 1);
      saveSessionState();

      const badge = document.getElementById('exam-timer-badge');
      if (badge) {
        const m = Math.floor(sess.remainingSec / 60);
        const s = sess.remainingSec % 60;
        badge.textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      if (sess.remainingSec === 0) {
        await finishStudentExam(false);
      }
    }, 1000);

    document.addEventListener('visibilitychange', async () => {
      if (document.hidden && state.activeExamSession && state.currentUser?.role === 'siswa') {
        const sess = state.activeExamSession;
        const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
        if (!jad || !jad.antiCurang) return;

        sess.violations = (sess.violations || 0) + 1;
        saveSessionState();
        const limit = jad.batasPelanggaran || 3;
        const recId = `rec_${sess.jadwalId}_${state.currentUser.id}`;
        await dbSaveDoc('exam_records', recId, {
          id: recId,
          jadwalId: sess.jadwalId,
          siswaId: state.currentUser.id,
          status: sess.violations >= limit ? 'terkunci' : 'mengerjakan',
          pelanggaran: sess.violations,
          answers: sess.answers
        }, 'examRecords');

        if (sess.violations >= limit) {
          await finishStudentExam(true);
        } else {
          showToast(`PERINGATAN ANTI-CURANG (${sess.violations}/${limit}): Dilarang meninggalkan layar ujian!`, 'error');
          renderApp();
        }
      }
    });

    document.addEventListener('contextmenu', (e) => {
      if (state.activeExamSession && state.currentUser?.role === 'siswa') {
        e.preventDefault();
      }
    });

    // Jalankan Pemulihan Sesi & Inisialisasi Aplikasi
    restoreSessionState();
    initBackend();
  </script>
</body>
</html>
